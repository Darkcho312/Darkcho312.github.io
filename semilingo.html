<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semilingo Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'sans-serif'] } } } }</script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: #020617;
      color: #e2e8f0;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 1.5rem;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.6);
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      width: 500px;
      height: 500px;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.1;
      animation: pulse 4s ease-in-out infinite;
    }

    #blob1 {
      top: -150px;
      right: -150px;
      background: #f59e0b;
    }

    #blob2 {
      bottom: -150px;
      left: -150px;
      background: #ea580c;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.07;
      }

      50% {
        opacity: 0.12;
      }
    }

    /* Timer */
    .t-bar-wrap {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
      width: 100%;
    }

    .t-bar {
      height: 100%;
      border-radius: 99px;
      transition: width 1s linear;
      background: linear-gradient(90deg, #fbbf24, #ea580c);
    }

    /* Buttons */
    .opt-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #334155;
      border-radius: 1rem;
      font-weight: 700;
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .opt-btn:hover {
      border-color: rgba(245, 158, 11, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(245, 158, 11, 0.1);
    }

    .opt-btn.correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: #34d399;
      transform: scale(1.02);
    }

    .opt-btn.wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: #f87171;
      opacity: 0.7;
    }

    .opt-btn:disabled {
      cursor: not-allowed;
    }

    .opt-label {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      border-radius: 8px;
      font-weight: 900;
      color: #94a3b8;
    }

    .opt-btn:hover .opt-label {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translate3d(-2px, 0, 0);
      }

      20%,
      80% {
        transform: translate3d(4px, 0, 0);
      }

      30%,
      50%,
      70% {
        transform: translate3d(-6px, 0, 0);
      }

      40%,
      60% {
        transform: translate3d(6px, 0, 0);
      }
    }

    .shake {
      animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
    }

    /* Heart */
    @keyframes heart {

      0%,
      100% {
        transform: scale(1);
      }

      25% {
        transform: scale(1.2);
      }

      50% {
        transform: scale(1);
      }

      75% {
        transform: scale(1.2);
      }
    }

    .heart-beat {
      animation: heart 1.5s infinite;
    }

    /* ── SUCCESS OVERLAY ── */
    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-14px)
      }
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.7);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes coinFloat {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      60% {
        transform: translateY(-60px) scale(1.2);
        opacity: 1;
      }

      100% {
        transform: translateY(-120px) scale(0.8);
        opacity: 0;
      }
    }

    @keyframes particleExplode {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translate(var(--dx), var(--dy)) scale(0);
        opacity: 0;
      }
    }

    @keyframes progressFill {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
      }

      50% {
        box-shadow: 0 0 50px rgba(251, 191, 36, 0.9), 0 0 80px rgba(234, 88, 12, 0.5);
      }
    }

    .overlay-card {
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 90%;
      position: relative;
      overflow: hidden;
      animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .overlay-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top, rgba(251, 191, 36, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .mileage-bar-bg {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      height: 14px;
      overflow: hidden;
      position: relative;
    }

    .mileage-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #fbbf24, #ea580c);
      animation: progressFill 1.2s cubic-bezier(0.25, 1, 0.5, 1) 0.6s both;
    }

    .coin-particle {
      position: absolute;
      font-size: 1.4rem;
      animation: coinFloat 0.9s ease-out forwards;
      pointer-events: none;
    }

    .close-countdown {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid rgba(251, 191, 36, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 900;
      color: #fbbf24;
      position: relative;
      flex-shrink: 0;
    }

    .close-countdown svg {
      position: absolute;
      inset: -3px;
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      transform: rotate(-90deg);
    }

    .close-countdown svg circle {
      stroke-dasharray: 163;
      stroke-dashoffset: 163;
      animation: countdownRing 3s linear 0.6s forwards;
      stroke: #fbbf24;
    }

    @keyframes countdownRing {
      from {
        stroke-dashoffset: 163;
      }

      to {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

<body>

  <div id="blob1" class="blob"></div>
  <div id="blob2" class="blob"></div>

  <div
    style="position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;padding:1.5rem;max-width:800px;margin:0 auto;justify-content:center;">

    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <div
          style="width:2.8rem;height:2.8rem;border-radius:0.75rem;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 0 20px rgba(245,158,11,0.2);">
          ⚡</div>
        <div>
          <div
            style="font-size:11px;color:rgba(251,191,36,0.8);font-weight:900;letter-spacing:0.2em;text-transform:uppercase;">
            Semilingo Challenge</div>
          <div id="hd-title" style="font-size:1rem;font-weight:900;line-height:1;margin-top:2px;color:white;"></div>
        </div>
      </div>
      <div
        style="background:rgba(127,29,29,0.4);border:1px solid rgba(239,68,68,0.3);padding:0.5rem 0.75rem;border-radius:0.75rem;display:flex;align-items:center;gap:0.5rem;">
        <span
          style="font-size:10px;color:#fca5a5;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;">Life</span>
        <div id="hearts" class="heart-beat" style="font-size:0.9rem;">❤️ ❤️ ❤️</div>
      </div>
    </header>

    <div style="margin-bottom:1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
        <span style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;">⏱ 시간
          제한</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <span id="t-num" style="font-size:1rem;font-weight:900;color:#fbbf24;">30</span>
          <span style="font-size:10px;color:#64748b;font-weight:700;">초</span>
        </div>
      </div>
      <div class="t-bar-wrap">
        <div id="t-bar" class="t-bar" style="width:100%;"></div>
      </div>
    </div>

    <div class="glass" style="padding:1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden;">
      <div
        style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#fbbf24,#ea580c);opacity:0.7;">
      </div>
      <div style="display:flex;gap:0.75rem;align-items:flex-start;">
        <span style="color:#fbbf24;font-weight:900;font-size:1.8rem;line-height:1;margin-top:2px;">Q.</span>
        <p id="q-text" style="font-size:1.25rem;font-weight:700;color:white;line-height:1.5;margin:0;"></p>
      </div>
    </div>

    <div id="opts" style="display:grid;grid-template-columns:1fr;gap:1rem;"></div>

  </div>

  <!-- SUCCESS OVERLAY -->
  <div id="overlay"
    style="position:fixed;inset:0;background:rgba(2,6,23,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999;opacity:0;transition:opacity 0.4s;">
    <div class="overlay-card" id="overlay-card">
      <!-- Sparkle top -->
      <div style="font-size:3.5rem;text-align:center;animation:bounce 1.2s ease-in-out infinite;margin-bottom:1rem;">🎉
      </div>

      <h1
        style="font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#fcd34d,#ea580c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin:0 0 0.5rem;animation:slideDown 0.4s ease 0.2s both;">
        STAGE CLEAR!</h1>

      <p
        style="text-align:center;font-size:0.85rem;color:#94a3b8;margin:0 0 2rem;animation:slideDown 0.4s ease 0.3s both;">
        정답을 맞혔습니다! 마일리지가 적립됩니다.</p>

      <!-- Mileage earn display -->
      <div
        style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.2);border-radius:1.25rem;padding:1.25rem 1.5rem;margin-bottom:1.5rem;animation:slideDown 0.4s ease 0.35s both;position:relative;"
        id="mileage-box">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;">
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span style="font-size:1.3rem;">🪙</span>
            <span
              style="font-size:0.8rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.1em;">마일리지
              획득</span>
          </div>
          <div style="font-size:1.6rem;font-weight:900;color:#fbbf24;">+500 P</div>
        </div>
        <div class="mileage-bar-bg">
          <div class="mileage-bar-fill"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:0.5rem;">
          <span style="font-size:0.7rem;color:#475569;">메인 지갑 적립 중...</span>
          <span style="font-size:0.7rem;color:#34d399;font-weight:700;">✓ 완료</span>
        </div>
      </div>

      <!-- Close countdown -->
      <div
        style="display:flex;align-items:center;gap:1rem;justify-content:center;animation:slideDown 0.4s ease 0.45s both;">
        <div class="close-countdown">
          <svg viewBox="0 0 54 54" fill="none">
            <circle cx="27" cy="27" r="26" stroke-width="3" stroke-linecap="round" />
          </svg>
          <span id="countdown-num">3</span>
        </div>
        <div>
          <p style="font-size:0.85rem;font-weight:700;color:#e2e8f0;margin:0;">잠시 후 자동으로 닫힙니다</p>
          <p style="font-size:0.75rem;color:#475569;margin:0;">메인 화면에서 마일리지를 확인하세요</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const QUIZ_DATA = {
      history: {
        num: 1, title: "역사/개요",
        q: "실리콘 원소에 불순물을 주입하여 전류를 제어할 수 있게 만드는 기술은?",
        opts: ["패키징 (Packaging)", "도핑 (Doping)", "식각 (Etching)", "노광 (Lithography)"],
        ans: 1
      },
      devices: {
        num: 2, title: "소자/회로",
        q: "채널의 4면을 모두 게이트로 감싸 누설 전류를 완벽에 가깝게 제어하는 최신 3D 트랜지스터 구조는?",
        opts: ["Planar FET", "FinFET", "GAA (Gate-All-Around)", "Trench MOSFET"],
        ans: 2
      },
      process: {
        num: 3, title: "8대 공정",
        q: "빛을 이용하여 웨이퍼 표면에 미세한 회로 패턴을 새기는 반도체의 핵심 공정은?",
        opts: ["증착 (Deposition)", "노광 (Photolithography)", "식각 (Etching)", "이온 주입 (Ion Implantation)"],
        ans: 1
      },
      future: {
        num: 4, title: "미래기술",
        q: "DRAM 여러 개를 수직으로 관통 전극(TSV)으로 연결해 대역폭을 혁신적으로 높인 차세대 메모리는?",
        opts: ["NAND Flash", "SRAM", "HBM (High Bandwidth Memory)", "EEPROM"],
        ans: 2
      }
    };

    const p = new URLSearchParams(location.search);
    let key = p.get('part') || 'history';
    if (!QUIZ_DATA[key]) key = 'history';
    const D = QUIZ_DATA[key];

    document.getElementById('hd-title').textContent = 'PART ' + D.num + ': ' + D.title;
    document.getElementById('q-text').textContent = D.q;

    const labels = ['A', 'B', 'C', 'D'];
    const optsCont = document.getElementById('opts');
    D.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = '<div class="opt-label">' + labels[i] + '</div><span>' + opt + '</span>';
      btn.onclick = () => check(i, btn);
      optsCont.appendChild(btn);
    });

    let hp = 3;
    let time = 30;
    let timerId = null;

    function renderHp() {
      let s = '';
      for (let i = 0; i < hp; i++) s += '❤️ ';
      for (let i = hp; i < 3; i++) s += '🖤 ';
      document.getElementById('hearts').textContent = s.trim();
    }

    function startTimer() {
      time = 30;
      updateTUI();
      timerId = setInterval(() => {
        time--;
        updateTUI();
        if (time <= 0) { clearInterval(timerId); onTimeUp(); }
      }, 1000);
    }

    function updateTUI() {
      const n = document.getElementById('t-num');
      const b = document.getElementById('t-bar');
      n.textContent = time;
      b.style.width = (time / 30 * 100) + '%';
      if (time <= 10) { b.style.background = 'linear-gradient(90deg,#ef4444,#fb7185)'; n.style.color = '#f87171'; }
      else if (time <= 20) { b.style.background = 'linear-gradient(90deg,#facc15,#fbbf24)'; n.style.color = '#facc15'; }
      else { b.style.background = 'linear-gradient(90deg,#fbbf24,#ea580c)'; n.style.color = '#fbbf24'; }
    }

    function onTimeUp() {
      hp--; renderHp();
      if (hp <= 0) {
        showFailOverlay();
      } else {
        document.getElementById('t-bar').style.background = '#ef4444';
        setTimeout(() => startTimer(), 700);
      }
    }

    function showFailOverlay() {
      // Simple fail screen
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;';
      el.innerHTML = `
    <div style="font-size:4rem;margin-bottom:1rem;">💀</div>
    <h2 style="font-size:2rem;font-weight:900;color:#f87171;margin:0 0 0.5rem;">GAME OVER</h2>
    <p style="color:#64748b;font-size:0.9rem;margin-bottom:1.5rem;">생명이 모두 소모되었습니다.</p>
    <button onclick="location.reload()" style="background:linear-gradient(135deg,#f59e0b,#ea580c);border:none;color:white;font-weight:900;padding:0.75rem 2rem;border-radius:1rem;cursor:pointer;font-size:0.95rem;">🔄 다시 도전</button>
  `;
      document.body.appendChild(el);
    }

    function spawnCoins(x, y) {
      for (let i = 0; i < 6; i++) {
        const coin = document.createElement('div');
        coin.className = 'coin-particle';
        coin.textContent = '🪙';
        const angle = (i / 6) * Math.PI * 2;
        const dist = 60 + Math.random() * 40;
        coin.style.left = (x - 12) + 'px';
        coin.style.top = (y - 12) + 'px';
        coin.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        coin.style.setProperty('--dy', (Math.sin(angle) * dist - 80) + 'px');
        coin.style.animationDelay = (i * 0.06) + 's';
        document.body.appendChild(coin);
        setTimeout(() => coin.remove(), 1200);
      }
    }

    function showSuccessOverlay() {
      if (window.opener && !window.opener.closed) {
        window.opener.earnMileageFromStage(500);
      }

      const ov = document.getElementById('overlay');
      ov.style.display = 'flex';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { ov.style.opacity = '1'; });
      });

      // Countdown
      let cnt = 3;
      const cnum = document.getElementById('countdown-num');
      const cTimer = setInterval(() => {
        cnt--;
        if (cnum) cnum.textContent = cnt;
        if (cnt <= 0) {
          clearInterval(cTimer);
          try { window.close(); } catch (e) { }
        }
      }, 1000);
    }

    function check(idx, btn) {
      clearInterval(timerId);
      const btns = document.querySelectorAll('.opt-btn');

      if (idx === D.ans) {
        btn.classList.add('correct');
        btn.innerHTML += '<div style="margin-left:auto;font-size:1.5rem;">✅</div>';
        btns.forEach(b => b.disabled = true);

        // Spawn coin particles at button location
        const rect = btn.getBoundingClientRect();
        spawnCoins(rect.left + rect.width / 2, rect.top + rect.height / 2);

        setTimeout(() => showSuccessOverlay(), 700);
      } else {
        hp--; renderHp();
        btn.classList.add('wrong');
        btn.innerHTML += '<div style="margin-left:auto;font-size:1.2rem;">❌</div>';
        btn.disabled = true;

        optsCont.classList.add('shake');
        setTimeout(() => optsCont.classList.remove('shake'), 500);

        if (hp <= 0) {
          setTimeout(() => showFailOverlay(), 400);
        } else {
          setTimeout(() => startTimer(), 700);
        }
      }
    }

    startTimer();
  </script>
</body>

</html>
