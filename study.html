<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semi-Docs</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Outfit','sans-serif']}}}}</script>
<style>
* { box-sizing: border-box; }
body { background: #020617; color: #e2e8f0; font-family: 'Outfit', sans-serif; min-height: 100vh; margin: 0; }

.glass {
  background: rgba(15,23,42,0.75);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.07);
  box-shadow: 0 25px 60px -12px rgba(0,0,0,0.6);
  border-radius: 1.5rem;
}

.blob {
  position: fixed; border-radius: 50%;
  width: 500px; height: 500px;
  filter: blur(100px);
  pointer-events: none; z-index: 0; opacity: 0.09;
}
#blob1 { top: -150px; right: -150px; }
#blob2 { bottom: -150px; left: -150px; }

/* slide fade */
.slide-panel { display: none; opacity: 0; transition: opacity 0.3s ease; }
.slide-panel.active { display: block; opacity: 1; }

/* bullet cards */
.bcard {
  background: rgba(15,23,42,0.85);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 0.875rem;
  padding: 1rem;
  transition: border-color 0.2s, transform 0.2s;
}
.bcard:hover { border-color: rgba(255,255,255,0.18); transform: translateY(-2px); }

/* compare cards */
.ccard { border-radius: 1rem; padding: 1rem 1.2rem; }

/* timeline */
.tl { position: relative; padding-left: 2rem; padding-bottom: 0.9rem; }
.tl::before {
  content: ''; position: absolute; left: 0.34rem; top: 1rem; bottom: 0;
  width: 2px; background: rgba(255,255,255,0.07);
}
.tl:last-child::before { display: none; }
.tldot {
  position: absolute; left: 0; top: 0.12rem;
  width: 0.75rem; height: 0.75rem; border-radius: 50%;
}

/* nav buttons */
.btn-nav {
  padding: 0.7rem 1.6rem; border-radius: 0.75rem;
  font-weight: 800; font-size: 0.875rem;
  cursor: pointer; border: none; transition: transform 0.15s, box-shadow 0.15s;
}
.btn-nav:hover { transform: scale(1.04); }
.btn-prev {
  background: #1e293b; border: 1px solid #334155; color: #64748b; cursor: not-allowed;
}
.btn-prev.enabled { color: #e2e8f0; cursor: pointer; }
.btn-prev.enabled:hover { background: #334155; }

.progress-pip {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.15); transition: background 0.3s, transform 0.3s;
}
.progress-pip.done { background: white; transform: scale(1.2); }
</style>
</head>
<body>

<div id="blob1" class="blob"></div>
<div id="blob2" class="blob"></div>

<div style="position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;padding:1.5rem;max-width:900px;margin:0 auto;">

  <!-- HEADER -->
  <header class="glass" style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;margin-bottom:1.5rem;position:sticky;top:1rem;z-index:20;">
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div id="hd-badge" style="width:2.2rem;height:2.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.9rem;color:white;flex-shrink:0;"></div>
      <div>
        <div style="font-size:10px;color:#64748b;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;">📚 Semi-Docs</div>
        <div id="hd-title" style="font-size:0.85rem;font-weight:800;line-height:1;margin-top:2px;"></div>
      </div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;" id="pip-row"></div>
  </header>

  <!-- SLIDE AREA -->
  <main style="flex:1;display:flex;align-items:center;margin-bottom:1.5rem;">
    <div id="slide-wrap" class="glass" style="width:100%;padding:2.5rem 3rem;min-height:420px;position:relative;overflow:hidden;">
      <!-- rendered by JS -->
    </div>
  </main>

  <!-- FOOTER NAV -->
  <footer style="display:flex;justify-content:space-between;align-items:center;">
    <button id="btn-prev" class="btn-nav btn-prev" onclick="goSlide(-1)">← 이전</button>
    <div style="font-size:0.8rem;color:#475569;font-weight:700;">
      <span id="cur-num" style="color:#22d3ee;font-size:1rem;font-weight:900;">1</span>
      <span style="margin:0 4px;color:#1e3a5f;">/</span>
      <span id="tot-num">4</span>
    </div>
    <button id="btn-next" class="btn-nav" onclick="goSlide(1)" style="color:white;">다음 슬라이드 →</button>
  </footer>
</div>

<!-- SUCCESS OVERLAY -->
<div id="overlay" style="position:fixed;inset:0;background:rgba(2,6,23,0.96);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9999;opacity:0;transition:opacity 0.5s;">

</div>
<style>@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}</style>

const badge = document.getElementById('hd-badge');
badge.textContent = D.num;
badge.style.background = D.grad;

// title
const titleEl = document.getElementById('hd-title');
titleEl.textContent = 'PART ' + D.num + ': ' + D.title;
titleEl.style.background = D.grad;
titleEl.style.webkitBackgroundClip = 'text';
titleEl.style.webkitTextFillColor = 'transparent';

// total
document.getElementById('tot-num').textContent = D.slides.length;

// build pip indicators
const pipRow = document.getElementById('pip-row');
D.slides.forEach((_,i) => {
  const d = document.createElement('div');
  d.className = 'progress-pip' + (i===0?' done':'');
  d.id = 'pip-'+i;
  pipRow.appendChild(d);
});

/* ─── RENDER ─── */
function renderSlide(s, idx) {
  const badgeHTML = '<div style="display:inline-block;padding:2px 10px;background:rgba(15,23,42,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:6px;font-size:10px;font-weight:900;color:#64748b;letter-spacing:0.2em;margin-bottom:12px;">SLIDE ' + String(idx+1).padStart(2,'0') + '</div>';
  const hr = '<div style="width:52px;height:3px;background:'+D.grad+';border-radius:999px;margin:10px 0 16px;"></div>';

  if (s.type === 'default') {
    return badgeHTML +
      '<h2 style="font-size:1.9rem;font-weight:900;color:white;line-height:1.2;margin:0 0 4px;">' + s.title + '</h2>' +
      hr +
      '<p style="font-size:1rem;color:#94a3b8;line-height:1.8;font-weight:300;">' + s.body + '</p>';
  }

  if (s.type === 'timeline') {
    const rows = s.items.map(function(it) {
      return '<div class="tl">' +
        '<div class="tldot" style="background:' + D.grad + ';"></div>' +
        '<div style="display:flex;gap:10px;">' +
          '<span style="font-size:11px;font-weight:900;width:42px;flex-shrink:0;margin-top:2px;background:'+D.grad+';-webkit-background-clip:text;-webkit-text-fill-color:transparent;">' + it.year + '</span>' +
          '<div>' +
            '<div style="font-size:0.88rem;font-weight:700;color:white;">' + it.title + '</div>' +
            '<div style="font-size:0.78rem;color:#64748b;margin-top:2px;line-height:1.5;">' + it.desc + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    return badgeHTML +
      '<h2 style="font-size:1.7rem;font-weight:900;color:white;margin:0 0 4px;">' + s.title + '</h2>' +
      hr + rows;
  }

  if (s.type === 'bullets') {
    const cols = s.items.length <= 2 ? 2 : 3;
    const cards = s.items.map(function(it) {
      return '<div class="bcard">' +
        '<div style="font-size:1.6rem;margin-bottom:8px;">' + it.icon + '</div>' +
        '<div style="font-size:0.82rem;font-weight:700;color:' + it.col + ';margin-bottom:6px;">' + it.title + '</div>' +
        '<div style="font-size:0.76rem;color:#64748b;line-height:1.6;white-space:pre-line;">' + it.desc + '</div>' +
      '</div>';
    }).join('');
    return badgeHTML +
      '<h2 style="font-size:1.6rem;font-weight:900;color:white;margin:0 0 4px;">' + s.title + '</h2>' +
      hr +
      (s.sub ? '<p style="font-size:0.75rem;color:#475569;margin-bottom:10px;">' + s.sub + '</p>' : '') +
      '<div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:12px;">' + cards + '</div>';
  }

  if (s.type === 'compare') {
    function side(obj) {
      const items = obj.items.map(function(i){ return '<li style="font-size:0.78rem;color:#94a3b8;display:flex;gap:6px;align-items:flex-start;"><span style="color:#1e3a5f;flex-shrink:0;">▸</span>' + i + '</li>'; }).join('');
      return '<div class="ccard" style="border:1px solid '+obj.border+';background:'+obj.bg+';">' +
        '<div style="font-size:0.85rem;font-weight:700;color:'+obj.col+';margin-bottom:10px;">' + obj.label + '</div>' +
        '<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;">' + items + '</ul>' +
      '</div>';
    }
    return badgeHTML +
      '<h2 style="font-size:1.6rem;font-weight:900;color:white;margin:0 0 4px;">' + s.title + '</h2>' +
      hr +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">' + side(s.left) + side(s.right) + '</div>';
  }
  return '';
}

/* ─── SLIDES ─── */
const wrap = document.getElementById('slide-wrap');
D.slides.forEach(function(s, i) {
  const div = document.createElement('div');
  div.id = 'sl-' + i;
  div.innerHTML = renderSlide(s, i);
  div.style.display = i === 0 ? 'block' : 'none';
  wrap.appendChild(div);
});

/* ─── NAVIGATION ─── */
function goSlide(dir) {
  const next = cur + dir;
  if (next < 0 || next > D.slides.length) return;

  if (next === D.slides.length) { finish(); return; }

  document.getElementById('sl-'+cur).style.display = 'none';
  document.getElementById('sl-'+next).style.display = 'block';

  // pip
  document.getElementById('pip-'+cur).classList.remove('done');
  document.getElementById('pip-'+next).classList.add('done');
  cur = next;
  updateNav();
}
window.goSlide = goSlide;

function updateNav() {
  document.getElementById('cur-num').textContent = cur + 1;

  const prev = document.getElementById('btn-prev');
  if (cur === 0) {
    prev.className = 'btn-nav btn-prev';
    prev.disabled = true;
  } else {
    prev.className = 'btn-nav btn-prev enabled';
    prev.disabled = false;
  }

  const nxt = document.getElementById('btn-next');
  if (cur === D.slides.length - 1) {
    nxt.textContent = '✅ 학습 완료 (+100P)';
    nxt.style.background = 'linear-gradient(135deg,#10b981,#14b8a6)';
    nxt.style.boxShadow = '0 0 24px rgba(16,185,129,0.35)';
  } else {
    nxt.textContent = '다음 슬라이드 →';
    nxt.style.background = D.grad;
    nxt.style.boxShadow = '';
  }
}

// set initial next button color
document.getElementById('btn-next').style.background = D.grad;

function finish() {
  if (window.opener && !window.opener.closed) {
    window.opener.earnMileageFromStage(100);
  }
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  requestAnimationFrame(function() { ov.style.opacity = '1'; });
  setTimeout(function() { try { window.close(); } catch(e) {} }, 3000);
}
</script>
</body>
</html>
