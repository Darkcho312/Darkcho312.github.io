<title>Global Semiconductor Map v8 (Black Outline Map)</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020810;--panel:#040d1c;--card:#071425;--card2:#0b1d35;
  --b:#0c2040;--b2:#1a3a6a;
  --neon:#00f0ff;--neon2:#0080ff;--neon3:#7000ff;
  --g:#00ff9d;--y:#ffb800;--pk:#ff2d78;--pu:#a855f7;
  --tx:#cce8ff;--sub:#4a7aaa;--mu:#0e2a45;
  /* sector colors */
  --c-fab:#00f0ff;--c-idm:#00ff9d;--c-fnd:#0080ff;--c-eq:#ffb800;--c-mat:#ff2d78;--c-osa:#a855f7;
}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(to bottom,var(--panel),var(--bg));border-bottom:1px solid var(--b);padding:12px 20px;display:flex;justify-content:between;align-items:center;z-index:10}
.logo{font-family:'Orbitron',sans-serif;font-weight:800;font-size:16px;letter-spacing:1px;background:linear-gradient(45deg,#fff,var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;background:var(--neon);border-radius:50%;box-shadow:0 0 8px var(--neon);animation:p 2s infinite}
@keyframes p{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.2);opacity:1}}
.main-container{flex:1;display:flex;position:relative;overflow:hidden}
.sidebar{width:280px;background:var(--panel);border-right:1px solid var(--b);padding:16px;display:flex;flex-direction:column;gap:16px;z-index:5}
.sidebar h3{font-size:13px;color:#fff;font-weight:700}
.sb-desc{font-size:11px;color:var(--sub);line-height:1.4}
.filter-group{display:flex;flex-direction:column;gap:6px}
.filter-btn{background:var(--card);border:1px solid var(--b);padding:8px 12px;border-radius:4px;color:#a2c2e8;text-align:left;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:between;font-size:12px}
.filter-btn:hover{border-color:var(--b2);background:var(--card2);color:#fff}
.filter-btn.active{border-color:var(--c);box-shadow:0 0 8px var(--c-rgba);background:linear-gradient(to right,var(--card2),transparent);color:#fff}
.filter-left{display:flex;align-items:center;gap:8px}
.filter-btn .cb{width:14px;height:14px;border:1px solid var(--b);border-radius:2px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4)}
.filter-btn.active .cb{background:var(--c);border-color:var(--c)}
.filter-btn.active .cb::after{content:'✓';font-size:9px;color:#020810;font-weight:bold}
.comp-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);background:rgba(0,0,0,.3);padding:1px 6px;border-radius:8px}
.all-btn{background:var(--mu);border:1px solid var(--neon);color:var(--neon);padding:8px;border-radius:4px;font-size:11px;cursor:pointer;font-weight:600;text-align:center;transition:all .2s}
.all-btn:hover{background:var(--neon);color:#020810;box-shadow:0 0 10px rgba(0,240,255,.4)}
.map-wrapper{flex:1;position:relative;overflow:hidden;background:#000;cursor:grab}
.map-wrapper:active{cursor:grabbing}
.map-content{position:absolute;transform-origin:0 0;width:1200px;height:620px}

.map-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.pin{position:absolute;width:20px;height:20px;margin-left:-10px;margin-top:-10px;cursor:pointer;z-index:4;pointer-events:auto}
.pin-circle{width:10px;height:10px;border-radius:50%;background:var(--c);border:1.5px solid #000;position:absolute;top:5px;left:5px;box-shadow:0 0 10px var(--c);transition:all .2s}
.pin:hover .pin-circle{transform:scale(1.4);box-shadow:0 0 16px var(--c)}
.pin-label{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:#040d1c;border:1px solid rgba(255,255,255,.2);padding:1px 5px;border-radius:3px;font-family:'Orbitron',sans-serif;font-size:9px;white-space:nowrap;color:#fff;opacity:.85;box-shadow:0 2px 4px rgba(0,0,0,.5);transition:all .2s}
.pin:hover .pin-label{opacity:1;border-color:var(--c);box-shadow:0 0(8px) var(--c)}
.pin-pulse{position:absolute;top:0;left:0;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c);opacity:0;animation:pw 2s infinite}
@keyframes pw{0%{transform:scale(.2);opacity:1}80%,100%{transform:scale(1.4);opacity:0}}
.dpanel{position:absolute;top:16px;right:-380px;width:340px;bottom:16px;background:rgba(4,13,28,.95);backdrop-filter:blur(10px);border:1px solid var(--b);border-radius:8px;padding:20px;box-shadow:-10px 0 25px rgba(0,0,0,.5);z-index:8;transition:right .3s ease;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.dpanel.active{right:16px}
.dpanel-close{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--sub);cursor:pointer;font-size:20px}
.dpanel-close:hover{color:#fff}
.dp-header .badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-family:'Orbitron',sans-serif;font-weight:600;margin-bottom:6px;background:var(--c-rgba);color:var(--c);border:1px solid var(--c)}
.dp-header h2{font-size:20px;color:#fff;font-weight:700}
.dp-header .country{font-size:11px;color:var(--sub)}
.dp-desc{font-size:12px;color:#a2c2e8;line-height:1.5;background:rgba(0,0,0,.2);padding:10px;border-radius:4px;border-left:3px solid var(--b2)}
.dp-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dp-stat-box{background:var(--card);border:1px solid var(--b);padding:8px;border-radius:4px}
.dp-stat-box .lbl{font-size:10px;color:var(--sub);margin-bottom:2px}
.dp-stat-box .val{font-family:'JetBrains Mono',monospace;font-size:12px;color:#fff;font-weight:600}
.dp-tags{display:flex;flex-wrap:wrap;gap:4px}
.dp-tag{background:var(--mu);color:var(--neon);font-size:10px;padding:2px 6px;border-radius:3px}
.dp-relations h4{font-size:11px;color:var(--sub);margin-bottom:6px}
.rel-list{display:flex;flex-direction:column;gap:4px}
.rel-item{display:flex;align-items:center;justify-content:between;background:var(--card);padding:8px 12px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.rel-item:hover{border-color:var(--b2);background:var(--card2)}
.rel-item .rname{color:#fff;font-weight:500}
.rel-item .rsec{font-size:9px;color:var(--sub);font-family:'Orbitron',sans-serif}
.map-ctrls{position:absolute;bottom:16px;left:16px;display:flex;gap:4px;z-index:6}
.ctrl-btn{width:32px;height:32px;background:var(--panel);border:1px solid var(--b);color:var(--tx);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.ctrl-btn:hover{border-color:var(--b2);background:var(--card2);color:#fff}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-dot"></div>GLOBAL SEMICONDUCTOR SUPPLY CHAIN MAP <span style="font-size:11px;color:var(--sub);font-weight:400;margin-left:8px;">v8.0 (블랙 네온 아웃라인 지도 적용)</span></div>
</header>
<div class="main-container">
  <div class="sidebar">
    <div>
      <h3>반도체 벨류체인 필터</h3>
      <div class="sb-desc">산업 영역별 카테고리를 멀티 선택하여 공급망 흐름을 오버레이할 수 있습니다.</div>
      <div style="height:10px"></div>
      <button class="all-btn" id="allToggleBtn">전체 토글</button>
      <div style="height:10px"></div>
      <div class="filter-group" id="sectorFilters"></div>
    </div>
  </div>
  <div class="map-wrapper" id="mapWrapper">
    <div class="map-content" id="mapContent">
      <div class="map-bg" id="mapImg"></div>
      <svg class="map-svg" id="mapSVG"></svg>
      <div id="pinsContainer"></div>
    </div>
    <div class="map-ctrls">
      <button class="ctrl-btn" id="zIn">+</button>
      <button class="ctrl-btn" id="zOut">-</button>
      <button class="ctrl-btn" id="zReset">⟲</button>
    </div>
  </div>
  <div class="dpanel" id="detailPanel">
    <button class="dpanel-close" id="panelClose">×</button>
    <div class="dp-header" id="dpHeader"></div>
    <div class="dp-desc" id="dpDesc"></div>
    <div class="dp-stats" id="dpStats"></div>
    <div>
      <div style="font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:700">핵심 기술 키워드</div>
      <div class="dp-tags" id="dpTags"></div>
    </div>
    <div class="dp-relations">
      <h4>글로벌 가치사슬 연계 기업</h4>
      <div class="rel-list" id="dpRels"></div>
    </div>
  </div>
</div>
<script>
const SECTORS = {
  fabless: { name: "Fabless (설계)", color: "var(--c-fab)" },
  idm: { name: "IDM (종합 반도체)", color: "var(--c-idm)" },
  foundry: { name: "Foundry (위탁생산)", color: "var(--c-fnd)" },
  equipment: { name: "Equipment (장비)", color: "var(--c-eq)" },
  materials: { name: "Materials (소재)", color: "var(--c-mat)" },
  osat: { name: "OSAT (패키징/후공정)", color: "var(--c-osa)" }
};

// 740x423 이미지 기반 비율에 최적화되도록 좌표 전면 재배치 및 보정 (1200x620 캔버스 크기 매핑)
// 미국: 서부(200~250), 동부(300~350) / 유럽: 네덜란드,독일(580~630) / 한국: (960~990, y: 220~250) / 대만: (960~980, y: 290~330)
const COMPANIES = [
  // 미국 (USA)
  { id: "amat", name: "Applied Materials", country: "미국", sector: "equipment", x: 210, y: 280, desc: "세계 1위 반도체 전공정 장비사.", founded: "1967", revenue: "$27.1B", employees: "34,000명", share: "증착/식각 1위", tags: ["PVD", "CVD", "수율관리"], relations: ["tsmc", "samsung", "skhynix"] },
  { id: "intc", name: "Intel", country: "미국", sector: "idm", x: 180, y: 300, desc: "전통적 CPU 강자 및 파운드리 재진입.", founded: "1968", revenue: "$52.9B", employees: "124,000명", share: "PC CPU 68%", tags: ["x86", "18A공정", "IDM"], relations: ["asml", "amat"] },
  { id: "amd", name: "AMD", country: "미국", sector: "fabless", x: 220, y: 300, desc: "고성능 CPU 및 Instinct AI 가속기.", founded: "1969", revenue: "$27.8B", employees: "26,000명", share: "서버 CPU 31%", tags: ["Ryzen", "EPYC", "칩렛"], relations: ["tsmc"] },
  { id: "nvda", name: "NVIDIA", country: "미국", sector: "fabless", x: 210, y: 315, desc: "AI 가속기 및 GPU 글로벌 1위.", founded: "1993", revenue: "$130.5B", employees: "29,600명", share: "AI 가속기 92%", tags: ["GPU", "CUDA", "Blackwell"], relations: ["tsmc", "skhynix", "samsung"] },
  { id: "qcom", name: "Qualcomm", country: "미국", sector: "fabless", x: 180, y: 325, desc: "모바일 AP 및 5G 통신 칩 선두.", founded: "1985", revenue: "$38.9B", employees: "51,000명", share: "모바일 AP 35%", tags: ["Snapdragon", "5G모뎀", "온디바이스AI"], relations: ["tsmc", "samsung"] },
  { id: "avgo", name: "Broadcom", country: "미국", sector: "fabless", x: 235, y: 335, desc: "데이터센터 네트워킹 및 ASIC 설계.", founded: "1961", revenue: "$48.5B", employees: "20,000명", share: "통신칩 1위", tags: ["네트워크스위치", "커스텀ASIC"], relations: ["tsmc"] },
  { id: "mu", name: "Micron", country: "미국", sector: "idm", x: 260, y: 290, desc: "미국 유일의 고성능 메모리 제조사.", founded: "1978", revenue: "$21.5B", employees: "43,000명", share: "DRAM 3위", tags: ["HBM3E", "10나노DRAM"], relations: ["nvda", "asml"] },
  { id: "txn", name: "Texas Instruments", country: "미국", sector: "idm", x: 290, y: 315, desc: "차량용/산업용 아날로그 반도체 강자.", founded: "1930", revenue: "$16.5B", employees: "33,000명", share: "아날로그 15%", tags: ["전력반도체", "MCU"], relations: ["tsmc"] },
  
  // 유럽 (Europe)
  { id: "asml", name: "ASML", country: "네덜란드", sector: "equipment", x: 575, y: 250, desc: "EUV 노광 장비 독점 생산.", founded: "1984", revenue: "$30.5B", employees: "42,400명", share: "EUV 100%", tags: ["EUV", "High-NA", "리소그래피"], relations: ["tsmc", "samsung", "intc"] },
  { id: "ifx", name: "Infineon", country: "독일", sector: "idm", x: 590, y: 270, desc: "전력 반도체 및 차량용 MCU 1위.", founded: "1999", revenue: "$16.8B", employees: "58,000명", share: "차량용 반도체 1위", tags: ["SiC", "파워반도체"], relations: ["tsmc"] },
  
  // 일본 (Japan)
  { id: "tel", name: "Tokyo Electron", country: "일본", sector: "equipment", x: 990, y: 320, desc: "코터/현상기 등 전공정 장비 강자.", founded: "1963", revenue: "$15.5B", employees: "16,000명", share: "코터/현상기 80%", tags: ["식각장비", "클린룸"], relations: ["samsung", "tsmc"] },
  { id: "shinetsu", name: "Shin-Etsu", country: "일본", sector: "materials", x: 985, y: 280, desc: "세계 1위 실리콘 웨이퍼 제조사.", founded: "1926", revenue: "$16.2B", employees: "25,000명", share: "웨이퍼 30%", tags: ["웨이퍼", "포토레지스트"], relations: ["tsmc", "samsung"] },
  
  // 한국 (Korea) - 본사 기준 인력 보정
  { id: "samsung", name: "삼성전자", country: "대한민국", sector: "idm", x: 920, y: 320, desc: "메모리 1위 및 GAA 공정 선두.", founded: "1969", revenue: "$111.1B", employees: "124,000명", share: "DRAM 45%", tags: ["HBM3E", "GAA", "NAND"], relations: ["asml", "amat", "nvda"] },
  { id: "skhynix", name: "SK하이닉스", country: "대한민국", sector: "idm", x: 945, y: 300, desc: "HBM 시장의 핵심 파트너.", founded: "1983", revenue: "$40.7B", employees: "32,000명", share: "HBM 52%", tags: ["HBM", "MR-MUF"], relations: ["nvda", "asml", "amat"] },
  
  // 대만 (Taiwan)
  { id: "mtk", name: "MediaTek", country: "대만", sector: "fabless", x: 915, y: 345, desc: "모바일 AP 점유율 1위 팹리스.", founded: "1997", revenue: "$16.1B", employees: "22,000명", share: "모바일 AP 35%", tags: ["Dimensity", "5G AP"], relations: ["tsmc"] },
  { id: "tsmc", name: "TSMC", country: "대만", sector: "foundry", x: 895, y: 365, desc: "파운드리 시장의 절대 강자.", founded: "1987", revenue: "$120.9B", employees: "76,000명", share: "파운드리 91%", tags: ["3나노", "CoWoS", "공정기술"], relations: ["nvda", "amd", "qcom"] },
  { id: "ase", name: "ASE", country: "대만", sector: "osat", x: 925, y: 365, desc: "전세계 1위 후공정(패키징/테스트) 기업.", founded: "1984", revenue: "$18.5B", employees: "95,000명", share: "OSAT 32%", tags: ["Flip-Chip", "패키징"], relations: ["tsmc", "nvda"] }
];

let activeSectors = new Set(Object.keys(SECTORS));
let selectedComp = null;
let sc_ = 1.0, tx = 0, ty = 0;

const wrap = document.getElementById('mapWrapper');
const content = document.getElementById('mapContent');
const svg = document.getElementById('mapSVG');
const pinsBox = document.getElementById('pinsContainer');

function init(){
  buildFilters();
  renderPins();
  centerMap();
}

function buildFilters(){
  const box = document.getElementById('sectorFilters');
  box.innerHTML = '';
  Object.keys(SECTORS).forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn ' + (activeSectors.has(k) ? 'active' : '');
    btn.style.setProperty('--c', SECTORS[k].color);
    btn.style.setProperty('--c-rgba', SECTORS[k].color + '1c');
    const count = COMPANIES.filter(c => c.sector === k).length;
    btn.innerHTML = `
      <div class="filter-left">
        <div class="cb"></div>
        <span>${SECTORS[k].name}</span>
      </div>
      <span class="comp-count">${count}개</span>
    `;
    btn.onclick = () => {
      if (activeSectors.has(k)) {
        activeSectors.delete(k);
        btn.classList.remove('active');
      } else {
        activeSectors.add(k);
        btn.classList.add('active');
      }
      renderPins();
      if(selectedComp) drawConnections(selectedComp);
    };
    box.appendChild(btn);
  });
}

document.getElementById('allToggleBtn').onclick = () => {
  const keys = Object.keys(SECTORS);
  if(activeSectors.size === keys.length){
    activeSectors.clear();
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  } else {
    keys.forEach(k => activeSectors.add(k));
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('active'));
  }
  renderPins();
  if(selectedComp) drawConnections(selectedComp);
};

function renderPins(){
  pinsBox.innerHTML = '';
  COMPANIES.forEach(c => {
    if(!activeSectors.has(c.sector)) return;
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.left = c.x + 'px';
    pin.style.top = c.y + 'px';
    pin.style.setProperty('--c', SECTORS[c.sector].color);
    pin.innerHTML = `<div class="pin-pulse"></div><div class="pin-circle"></div><div class="pin-label">${c.name}</div>`;
    pin.onclick = (e) => {
      e.stopPropagation();
      openPanel(c);
    };
    pinsBox.appendChild(pin);
  });
}

function openPanel(c){
  selectedComp = c;
  document.getElementById('detailPanel').classList.add('active');
  document.getElementById('dpHeader').innerHTML = `
    <div class="badge" style="--c:${SECTORS[c.sector].color};--c-rgba:${SECTORS[c.sector].color+'22'}">${SECTORS[c.sector].name}</div>
    <h2>${c.name}</h2>
    <div class="country">${c.country}</div>
  `;
  document.getElementById('dpDesc').innerText = c.desc;
  document.getElementById('dpStats').innerHTML = `
    <div class="dp-stat-box"><div class="lbl">설립 구분</div><div class="val">${c.founded}</div></div>
    <div class="dp-stat-box"><div class="lbl">연 매출액(2025년 기준)</div><div class="val">${c.revenue}</div></div>
    <div class="dp-stat-box"><div class="lbl">직원수</div><div class="val">${c.employees}</div></div>
    <div class="dp-stat-box"><div class="lbl">시장 점유율</div><div class="val" style="color:var(--g)">${c.share}</div></div>
  `;
  document.getElementById('dpTags').innerHTML = c.tags.map(t=>`<span class="dp-tag">#${t}</span>`).join('');
  
  const rBox = document.getElementById('dpRels');
  rBox.innerHTML = '';
  c.relations.forEach(rId => {
    const rc = COMPANIES.find(x => x.id === rId);
    if(!rc) return;
    const item = document.createElement('div');
    item.className = 'rel-item';
    item.innerHTML = `<span class="rname">${rc.name}</span><span class="rsec">${SECTORS[rc.sector].name.split(' ')[0]}</span>`;
    item.onclick = (e) => { e.stopPropagation(); openPanel(rc); };
    rBox.appendChild(item);
  });
  drawConnections(c);
}

function drawConnections(src){
  svg.querySelectorAll('.tech-line').forEach(n => n.remove());
  src.relations.forEach(rId => {
    const tgt = COMPANIES.find(x => x.id === rId);
    if(!tgt || !activeSectors.has(tgt.sector)) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'tech-line');
    const dx = tgt.x - src.x, dy = tgt.y - src.y;
    const dr = Math.sqrt(dx*dx + dy*dy) * 1.35;
    path.setAttribute('d', `M${src.x},${src.y} A${dr},${dr} 0 0,1 ${tgt.x},${tgt.y}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', SECTORS[src.sector].color);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-dasharray', '4 4');
    svg.appendChild(path);
  });
}

function closePanel(){
  selectedComp = null;
  document.getElementById('detailPanel').classList.remove('active');
  svg.querySelectorAll('.tech-line').forEach(n => n.remove());
}
document.getElementById('panelClose').onclick = closePanel;
wrap.onclick = closePanel;

function applyT(){ content.style.transform = `translate(${tx}px,${ty}px) scale(${sc_})`; }

let isD = false, sx, sy;
wrap.onmousedown = (e) => {
  if(e.target.closest('.pin') || e.target.closest('.map-ctrls') || e.target.closest('.filter-btn') || e.target.closest('#allToggleBtn')) return;
  isD = true; sx = e.clientX - tx; sy = e.clientY - ty;
};
window.onmousemove = (e) => { if(isD){ tx = e.clientX - sx; ty = e.clientY - sy; applyT(); } };
window.onmouseup = () => isD = false;

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.1 : 0.9;
  const r = wrap.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx - (mx - tx) * f; ty = my - (my - ty) * f;
  sc_ *= f; sc_ = Math.min(Math.max(sc_, 0.3), 8);
  applyT();
}, {passive:false});

function centerMap(){
  const r = wrap.getBoundingClientRect();
  sc_ = Math.min(r.width / 1200, r.height / 620) * 0.95;
  tx = (r.width - 1200 * sc_) / 2;
  ty = (r.height - 620 * sc_) / 2;
  applyT();
}
document.getElementById('zIn').onclick = (e) => { e.stopPropagation(); sc_ *= 1.25; sc_ = Math.min(sc_, 8); applyT(); };
document.getElementById('zOut').onclick = (e) => { e.stopPropagation(); sc_ *= 0.8; sc_ = Math.max(sc_, 0.3); applyT(); };
document.getElementById('zReset').onclick = (e) => { e.stopPropagation(); centerMap(); };

window.onresize = centerMap;
window.onload = init;
</script>
</body>
</html>
